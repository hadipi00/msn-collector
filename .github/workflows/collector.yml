name: MSN Collector

on:
  schedule:
    # minute 0 is heavily oversubscribed on GitHub and schedule events get
    # dropped — use off-minute slots, and two of them per 2h cycle for
    # redundancy (one dropped slot can no longer leave the collector dark).
    - cron: "17 */2 * * *"   # even hours at :17
    - cron: "47 */2 * * *"   # even hours at :47 (second slot, redundancy)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collector
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OK_BUDGET_SEC: "300"   # cap outlinekeys key-page fetching per cycle (cache is committed, so progress carries over)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # `timeout` bounds every collector so the commit step ALWAYS runs
      # even when one source site stalls — data keeps flowing every 2h.
      - name: Run V2Ray collector
        continue-on-error: true
        run: timeout 20m python -u collector.py

      - name: Run plain proxy collector (publicvpnlist.com)
        continue-on-error: true
        run: timeout 10m python -u plain_proxy_collector.py

      - name: Run MTProto collector (channels + proxybolt.link + WireGuard)
        continue-on-error: true
        run: timeout 12m python -u mtproto_collector.py

      - name: Run OpenVPN collector (channels + VPNBook)
        continue-on-error: true
        run: timeout 12m python -u openvpn_collector.py

      - name: Commit and push
        run: |
          git config user.name "msn-bot"
          git config user.email "bot@users.noreply.github.com"
          [ -f outlinekeys_cache.json ] && git add -f outlinekeys_cache.json || true
          git add -A
          git diff --cached --quiet || (git commit -m "auto-update: $(date -u '+%Y-%m-%d %H:%M') UTC" && git push)
