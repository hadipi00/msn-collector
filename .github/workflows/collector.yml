name: MSN Collector

on:
  schedule:
    - cron: "0 */2 * * *"   # every 2 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collector
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OK_BUDGET_SEC: "600"   # cap outlinekeys key-page fetching per cycle (cache is committed, so progress carries over)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run V2Ray collector
        continue-on-error: true
        run: python collector.py

      - name: Run plain proxy collector (publicvpnlist.com)
        continue-on-error: true
        run: python plain_proxy_collector.py

      - name: Run MTProto collector (channels + proxybolt.link + WireGuard)
        continue-on-error: true
        run: python mtproto_collector.py

      - name: Run OpenVPN collector (channels + VPNBook)
        continue-on-error: true
        run: python openvpn_collector.py

      - name: Commit and push
        run: |
          git config user.name "msn-bot"
          git config user.email "bot@users.noreply.github.com"
          [ -f outlinekeys_cache.json ] && git add -f outlinekeys_cache.json || true
          git add -A
          git diff --cached --quiet || (git commit -m "auto-update: $(date -u '+%Y-%m-%d %H:%M') UTC" && git push)
